<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc">
<title id="title">One wide-angle measurement separates two model curves</title>
<desc id="desc">Computed mathematical illustration, not a screenshot or measured data. For angle theta in radians from zero to pi over two, the normalized restoring-torque magnitudes theta for a spring and sin(theta) for gravity nearly agree at small angles. At 90 degrees they predict 1.571 and 1.000 respectively. The shaded region marks zero to 15 degrees. These curves illustrate a question investigated in WORLDLAW; they are not an exported project result.</desc>
<rect width="600" height="620" fill="#0b1921"/>
<text x="30.000" y="42.000" fill="#e9ac83" font-family="sans-serif" font-size="23" text-anchor="start">SPRING</text>
<text x="225.000" y="42.000" fill="#e9ac83" font-family="sans-serif" font-size="23" text-anchor="start">f(θ) = θ</text>
<text x="30.000" y="79.000" fill="#9edcc9" font-family="sans-serif" font-size="23" text-anchor="start">GRAVITY</text>
<text x="225.000" y="79.000" fill="#9edcc9" font-family="sans-serif" font-size="23" text-anchor="start">f(θ) = sin θ</text>
<text x="30.000" y="132.000" fill="#e6f0f2" font-family="sans-serif" font-size="24" text-anchor="start">Near zero, almost the same.</text>
<text x="30.000" y="163.000" fill="#e6f0f2" font-family="sans-serif" font-size="24" text-anchor="start">At 90°, a different prediction.</text>
