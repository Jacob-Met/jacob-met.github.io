<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">One wide-angle measurement separates two model curves</title>
<desc id="desc">Computed mathematical illustration, not a screenshot or measured data. For angle theta in radians from zero to pi over two, the normalized restoring-torque magnitudes theta for a spring and sin(theta) for gravity nearly agree at small angles. At 90 degrees they predict 1.571 and 1.000 respectively. The shaded region marks zero to 15 degrees. These curves illustrate a question investigated in WORLDLAW; they are not an exported project result.</desc>
