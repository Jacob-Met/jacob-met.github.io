<text x="30.000" y="42.000" fill="#e6f0f2" font-family="sans-serif" font-size="26" text-anchor="start">Near zero, almost the same.</text>
<text x="30.000" y="76.000" fill="#9bbac7" font-family="sans-serif" font-size="22" text-anchor="start">A wider angle separates the predictions.</text>
