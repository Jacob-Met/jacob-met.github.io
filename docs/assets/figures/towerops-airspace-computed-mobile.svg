<svg xmlns="http://www.w3.org/2000/svg" width="600" height="916" viewBox="0 0 600 916" role="img" aria-labelledby="title desc"><title id="title">Synthetic flight paths before and after a TowerOps decision</title><desc id="desc">Computed from the retained native Python result, not a screenshot. The same two flights project one conflict before the decision and zero after approval, matching readback, and native application. Dashed paths project five minutes; axes are nautical miles. The first conflict interval is 2.50 to 5.00 minutes.</desc><rect width="600" height="916" fill="#0b1921" /><g transform="translate(-18,-168)"><rect x="48" y="184" width="540" height="430" rx="14" fill="#142b34" stroke="#2a4751" /><text x="72" y="217" fill="#a3bac0" font-family="monospace" font-size="28" font-weight="normal" text-anchor="start">BEFORE</text><text x="564" y="219" fill="#f6a18b" font-family="monospace" font-size="30" font-weight="normal" text-anchor="end">1 CONFLICT</text><path d="M225.14285714285714,252V512.0" stroke="#2a4751" /><text x="225.14285714285714" y="529.0" fill="#a3bac0" font-family="monospace" font-size="26" font-weight="normal" text-anchor="middle">-5</text><path d="M318.0,252V512.0" stroke="#2a4751" /><text x="318.0" y="529.0" fill="#a3bac0" font-family="monospace" font-size="26" font-weight="normal" text-anchor="middle">0</text><path d="M410.8571428571429,252V512.0" stroke="#2a4751" /><text x="410.8571428571429" y="529.0" fill="#a3bac0" font-family="monospace" font-size="26" font-weight="normal" text-anchor="middle">5</text><path d="M169.42857142857142,474.8571428571429H466.57142857142856" stroke="#2a4751" /><text x="160.42857142857142" y="478.8571428571429" fill="#a3bac0" font-family="monospace" font-size="26" font-weight="normal" text-anchor="end">0</text><path d="M169.42857142857142,382.0H466.57142857142856" stroke="#2a4751" /><text x="160.42857142857142" y="386.0" fill="#a3bac0" font-family="monospace" font-size="26" font-weight="normal" text-anchor="end">5