name: Verify live public site
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rebuild declared public site
        run: |
          python source/build.py --out checked-site
          python source/check.py checked-site
          diff -qr docs checked-site
      - name: Verify HTTPS deployment byte-for-byte
        run: |
          python source/verify_deployment.py \
            --root checked-site \
            --base https://jacobmetoyer.com \
            --receipt "$RUNNER_TEMP/site-live-receipt.json"
      - name: Keep live verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-site-receipt
          path: ${{ runner.temp }}/site-live-receipt.json
          if-no-files-found: ignore
          retention-days: 14
