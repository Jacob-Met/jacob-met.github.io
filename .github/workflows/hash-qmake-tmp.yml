name: hash-qmake-tmp
on:
  workflow_dispatch:
  push:
    paths:
      - 'tmp/qmake_*.py'
      - '.github/workflows/hash-qmake-tmp.yml'
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hash and write
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('tmp')
          out = {}
          for name in ['qmake_open.py', 'qmake_closed.py', 'qmake_test.py']:
              p = root / name
              data = p.read_bytes()
              out[name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          pathlib.Path('tmp/qmake_digests.json').write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps(out, indent=2))
          PY
      - name: commit digests
        run: |
          git config user.name 'hash-bot'
          git config user.email 'hash-bot@users.noreply.github.com'
          git add tmp/qmake_digests.json
          git diff --cached --quiet || (git commit -m 'tmp: qmake digests' && git push)
