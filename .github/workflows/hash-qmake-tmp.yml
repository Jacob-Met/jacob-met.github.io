name: hash-qmake-tmp
on:
  workflow_dispatch:
  push:
    paths:
      - 'tmp/**'
      - '.github/workflows/hash-qmake-tmp.yml'
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hash and write
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('tmp')
          out = {}
          for name in sorted(p.name for p in root.iterdir() if p.is_file()):
              p = root / name
              data = p.read_bytes()
              out[name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          pathlib.Path('tmp/qmake_digests.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: commit digests
        run: |
          git config user.name 'hash-bot'
          git config user.email 'hash-bot@users.noreply.github.com'
          git add tmp/qmake_digests.json
          git diff --cached --quiet || (git commit -m 'tmp: qmake digests refresh' && git push)
